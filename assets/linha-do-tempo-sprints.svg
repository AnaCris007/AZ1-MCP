<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8A94A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="610" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#1F2933">Linha do tempo de entrega — Sprints 3, 4 e 5</text>
  <text x="24" y="52" font-size="12" fill="#5A6472">Distribuição das frentes de trabalho ao longo das três sprints de construção da solução AZ1</text>

  <!-- cabecalhos das sprints -->
  <rect x="194" y="62" width="292" height="46" rx="4" fill="#E8EDF2"/>
  <text x="340" y="82" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">Sprint 3</text>
  <text x="340" y="99" font-size="11.5" fill="#5A6472" text-anchor="middle">31/08/2026 a 11/09/2026</text>

  <rect x="494" y="62" width="292" height="46" rx="4" fill="#E8EDF2"/>
  <text x="640" y="82" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">Sprint 4</text>
  <text x="640" y="99" font-size="11.5" fill="#5A6472" text-anchor="middle">14/09/2026 a 25/09/2026</text>

  <rect x="794" y="62" width="292" height="46" rx="4" fill="#E8EDF2"/>
  <text x="940" y="82" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">Sprint 5</text>
  <text x="940" y="99" font-size="11.5" fill="#5A6472" text-anchor="middle">28/09/2026 a 09/10/2026</text>

  <line x1="190" y1="118" x2="1094" y2="118" stroke="#8A94A6" stroke-width="1" marker-end="url(#seta)"/>

  <!-- faixas alternadas -->
  <rect x="20" y="130" width="1080" height="52" fill="#F5F7F9"/>
  <rect x="20" y="234" width="1080" height="52" fill="#F5F7F9"/>
  <rect x="20" y="338" width="1080" height="52" fill="#F5F7F9"/>
  <rect x="20" y="442" width="1080" height="52" fill="#F5F7F9"/>
  <rect x="20" y="546" width="1080" height="52" fill="#F5F7F9"/>

  <!-- separadores de sprint -->
  <line x1="490" y1="130" x2="490" y2="598" stroke="#D5DCE4" stroke-width="1"/>
  <line x1="790" y1="130" x2="790" y2="598" stroke="#D5DCE4" stroke-width="1"/>

  <!-- 1. API de audio -->
  <text x="24" y="160" font-size="12.5" fill="#1F2933">API de recebimento de áudio</text>
  <rect x="198" y="141" width="284" height="30" rx="4" fill="#1B5E9E"/>
  <text x="340" y="160" font-size="12" fill="#FFFFFF" text-anchor="middle">Construção e documentação</text>
  <rect x="498" y="141" width="584" height="30" rx="4" fill="#1B5E9E" fill-opacity="0.18" stroke="#1B5E9E" stroke-opacity="0.5"/>
  <text x="790" y="160" font-size="11.5" fill="#1F2933" text-anchor="middle">Manutenção e integração com os demais componentes</text>

  <!-- 2. STT e PLN -->
  <text x="24" y="212" font-size="12.5" fill="#1F2933">Speech-to-Text e PLN</text>
  <rect x="198" y="193" width="284" height="30" rx="4" fill="#6A4C93"/>
  <text x="340" y="212" font-size="12" fill="#FFFFFF" text-anchor="middle">Início: transcrição e classificação</text>
  <rect x="498" y="193" width="284" height="30" rx="4" fill="#6A4C93"/>
  <text x="640" y="212" font-size="12" fill="#FFFFFF" text-anchor="middle">Integração com o banco de dados</text>
  <rect x="798" y="193" width="284" height="30" rx="4" fill="#6A4C93"/>
  <text x="940" y="212" font-size="12" fill="#FFFFFF" text-anchor="middle">Consolidação e ajuste final</text>

  <!-- 3. Frontend -->
  <text x="24" y="264" font-size="12.5" fill="#1F2933">Frontend</text>
  <rect x="198" y="245" width="284" height="30" rx="4" fill="#C46A11"/>
  <text x="340" y="264" font-size="12" fill="#FFFFFF" text-anchor="middle">Interface básica integrada às APIs</text>
  <rect x="498" y="245" width="284" height="30" rx="4" fill="#C46A11" fill-opacity="0.18" stroke="#C46A11" stroke-opacity="0.5"/>
  <text x="640" y="264" font-size="11.5" fill="#1F2933" text-anchor="middle">Evolução incremental</text>
  <rect x="798" y="245" width="284" height="30" rx="4" fill="#C46A11"/>
  <text x="940" y="264" font-size="12" fill="#FFFFFF" text-anchor="middle">Interface completa e acessível</text>

  <!-- 4. Integracao front-back -->
  <text x="24" y="309" font-size="12.5" fill="#1F2933">Integração entre</text>
  <text x="24" y="325" font-size="12.5" fill="#1F2933">frontend e backend</text>
  <rect x="198" y="297" width="584" height="30" rx="4" fill="#0E7C86" fill-opacity="0.18" stroke="#0E7C86" stroke-opacity="0.5"/>
  <text x="490" y="316" font-size="11.5" fill="#1F2933" text-anchor="middle">Integração progressiva das funcionalidades já construídas</text>
  <rect x="798" y="297" width="284" height="30" rx="4" fill="#0E7C86"/>
  <text x="940" y="316" font-size="12" fill="#FFFFFF" text-anchor="middle">Integração completa e tratamento de falhas</text>

  <!-- 5. Banco de dados -->
  <text x="24" y="368" font-size="12.5" fill="#1F2933">Banco de dados</text>
  <rect x="198" y="349" width="284" height="30" rx="4" fill="#2E7D57" fill-opacity="0.18" stroke="#2E7D57" stroke-opacity="0.5"/>
  <text x="340" y="368" font-size="11.5" fill="#1F2933" text-anchor="middle">Modelagem e preparação</text>
  <rect x="498" y="349" width="284" height="30" rx="4" fill="#2E7D57"/>
  <text x="640" y="368" font-size="12" fill="#FFFFFF" text-anchor="middle">Início: criação, população e operações</text>
  <rect x="798" y="349" width="284" height="30" rx="4" fill="#2E7D57"/>
  <text x="940" y="368" font-size="12" fill="#FFFFFF" text-anchor="middle">Consultas otimizadas</text>

  <!-- 6. Webhooks -->
  <text x="24" y="420" font-size="12.5" fill="#1F2933">Webhooks (dois)</text>
  <rect x="498" y="401" width="284" height="30" rx="4" fill="#0E7C86"/>
  <text x="640" y="420" font-size="12" fill="#FFFFFF" text-anchor="middle">Configuração e documentação</text>
  <rect x="798" y="401" width="284" height="30" rx="4" fill="#0E7C86" fill-opacity="0.18" stroke="#0E7C86" stroke-opacity="0.5"/>
  <text x="940" y="420" font-size="11.5" fill="#1F2933" text-anchor="middle">Integração com a mensageria</text>

  <!-- 7. Mensageria -->
  <text x="24" y="472" font-size="12.5" fill="#1F2933">Sistema de mensageria</text>
  <rect x="498" y="453" width="284" height="30" rx="4" fill="#0E7C86" fill-opacity="0.18" stroke="#0E7C86" stroke-opacity="0.5"/>
  <text x="640" y="472" font-size="11.5" fill="#1F2933" text-anchor="middle">Definição da tecnologia</text>
  <rect x="798" y="453" width="284" height="30" rx="4" fill="#0E7C86"/>
  <text x="940" y="472" font-size="12" fill="#FFFFFF" text-anchor="middle">Produtores, consumidores e filas</text>

  <!-- 8. Deploy -->
  <text x="24" y="524" font-size="12.5" fill="#1F2933">Deploy e ambientes</text>
  <rect x="198" y="505" width="284" height="30" rx="4" fill="#B03A2E" fill-opacity="0.18" stroke="#B03A2E" stroke-opacity="0.5"/>
  <text x="340" y="524" font-size="11.5" fill="#1F2933" text-anchor="middle">Ambiente local e containerização</text>
  <rect x="498" y="505" width="284" height="30" rx="4" fill="#B03A2E"/>
  <text x="640" y="524" font-size="12" fill="#FFFFFF" text-anchor="middle">Início: deploy em nuvem</text>
  <rect x="798" y="505" width="284" height="30" rx="4" fill="#B03A2E"/>
  <text x="940" y="524" font-size="12" fill="#FFFFFF" text-anchor="middle">Monitoramento e manutenção</text>

  <!-- 9. Testes -->
  <text x="24" y="576" font-size="12.5" fill="#1F2933">Testes</text>
  <rect x="198" y="557" width="284" height="30" rx="4" fill="#4A5568"/>
  <text x="340" y="576" font-size="12" fill="#FFFFFF" text-anchor="middle">Planejamento dos testes</text>
  <rect x="498" y="557" width="284" height="30" rx="4" fill="#4A5568"/>
  <text x="640" y="576" font-size="12" fill="#FFFFFF" text-anchor="middle">Execução e evidências</text>
  <rect x="798" y="557" width="284" height="30" rx="4" fill="#4A5568"/>
  <text x="940" y="576" font-size="12" fill="#FFFFFF" text-anchor="middle">Complementação e cobertura</text>
</svg>
