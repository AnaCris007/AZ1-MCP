<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Cadeia de valor relacionada à gestão do portfólio de projetos</title>
  <desc id="desc">Processos de apoio sustentam o planejamento, o acompanhamento, a consolidação e a tomada de decisão, com indicação do ponto de atuação do agente AZ1.</desc>
  <style>.title{font:700 26px Arial;fill:#17324d}.heading{font:700 18px Arial;fill:#fff}.text{font:16px Arial;fill:#17324d}.small{font:14px Arial;fill:#17324d}.primary{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.support{fill:#e2e8f0;stroke:#64748b;stroke-width:2}.az1{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
  <text x="600" y="40" text-anchor="middle" class="title">Cadeia de valor — gestão do portfólio de projetos</text>
  <rect x="45" y="75" width="1110" height="55" rx="8" fill="#334155"/><text x="600" y="109" text-anchor="middle" class="heading">PROCESSOS DE APOIO</text>
  <rect x="65" y="150" width="250" height="70" rx="8" class="support"/><text x="190" y="180" text-anchor="middle" class="text">Governança e normativos</text><text x="190" y="202" text-anchor="middle" class="small">do PMO Corporativo</text>
  <rect x="335" y="150" width="250" height="70" rx="8" class="support"/><text x="460" y="180" text-anchor="middle" class="text">Gestão documental</text><text x="460" y="202" text-anchor="middle" class="small">e controle de acesso</text>
  <rect x="605" y="150" width="250" height="70" rx="8" class="support"/><text x="730" y="180" text-anchor="middle" class="text">Tecnologia e dados</text><text x="730" y="202" text-anchor="middle" class="small">do portfólio</text>
  <rect x="875" y="150" width="250" height="70" rx="8" class="support"/><text x="1000" y="180" text-anchor="middle" class="text">Auditoria, segurança</text><text x="1000" y="202" text-anchor="middle" class="small">e rastreabilidade</text>
  <rect x="45" y="255" width="1110" height="55" rx="8" fill="#2563eb"/><text x="600" y="289" text-anchor="middle" class="heading">PROCESSOS PRIMÁRIOS</text>
  <rect x="45" y="340" width="200" height="85" rx="8" class="primary"/><text x="145" y="375" text-anchor="middle" class="text">Planejar e cadastrar</text><text x="145" y="399" text-anchor="middle" class="small">empreendimentos</text><path d="M245 382 H270" class="arrow"/>
  <rect x="275" y="340" width="200" height="85" rx="8" class="primary"/><text x="375" y="375" text-anchor="middle" class="text">Executar e atualizar</text><text x="375" y="399" text-anchor="middle" class="small">informações</text><path d="M475 382 H500" class="arrow"/>
  <rect x="505" y="340" width="200" height="85" rx="8" class="az1"/><text x="605" y="368" text-anchor="middle" class="text">Consultar, alertar</text><text x="605" y="391" text-anchor="middle" class="small">e sugerir conteúdo</text><text x="605" y="413" text-anchor="middle" class="small">(apoio do AZ1)</text><path d="M705 382 H730" class="arrow"/>
  <rect x="735" y="340" width="200" height="85" rx="8" class="primary"/><text x="835" y="375" text-anchor="middle" class="text">Consolidar e analisar</text><text x="835" y="399" text-anchor="middle" class="small">o portfólio</text><path d="M935 382 H960" class="arrow"/>
  <rect x="965" y="340" width="190" height="85" rx="8" class="primary"/><text x="1060" y="375" text-anchor="middle" class="text">Reportar e apoiar</text><text x="1060" y="399" text-anchor="middle" class="small">a decisão</text>
  <rect x="250" y="470" width="700" height="55" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="600" y="503" text-anchor="middle" class="text">Valor entregue: informação acessível, confiável e rastreável para a gestão dos projetos</text>
</svg>
