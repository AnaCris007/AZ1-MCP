# =============================================================================
# AZ1 — sobreposição de PRODUÇÃO
# =============================================================================
# Não é carregado automaticamente. O uso é explícito, e sempre com a base junto:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml logs -f api
#
# Como a linha é longa e repetida, vale exportar de uma vez na máquina de deploy:
#
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#
# ...e voltar a usar "docker compose up -d" normalmente. Definir COMPOSE_FILE
# também neutraliza o carregamento automático do override de desenvolvimento,
# que é o erro mais fácil de cometer num servidor.
#
# O que este arquivo acrescenta: limites de recurso, política de reinício mais
# agressiva, mais de um worker no uvicorn e a porta 80 no host. O que ele NÃO
# faz: afrouxar nada. Todo endurecimento vive na base, justamente para não
# depender de alguém lembrar de aplicá-lo aqui.
# =============================================================================

services:
  api:
    restart: always

    # Liga a verificação do entrypoint que recusa a credencial de exemplo. A
    # trava ${VAR:?...} do MinIO, abaixo, só pega variável AUSENTE — e um .env
    # copiado do .env.example tem AUDIO_STORAGE_SECRET_KEY presente, valendo
    # "minioadmin". Sem esta linha, seria exatamente assim que credencial padrão
    # chegaria à produção: passando por todas as validações.
    environment:
      AZ1_REFUSE_DEFAULT_CREDENTIALS: "1"

    # Múltiplos workers: cada requisição de análise carrega o pipeline do
    # scikit-learn e trabalha em CPU, então um processo só serializa tudo atrás
    # do GIL. Cada worker carrega a própria cópia do modelo (~100 KB aqui, mas
    # é o que define o teto de memória em modelos maiores).
    #
    # --forwarded-allow-ips só é seguro porque a API não é publicada: o único
    # caminho até ela é o nginx da rede interna. Numa API exposta diretamente,
    # aceitar X-Forwarded-For de qualquer origem é deixar o cliente forjar o
    # próprio IP no log e em qualquer regra que dependa dele.
    command:
      - uvicorn
      - az1_api.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=${UVICORN_WORKERS:-2}
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --no-server-header

    deploy:
      resources:
        limits:
          # Sem teto, um pico de análise consome a instância inteira e derruba
          # o MinIO junto — o modo de falha em que um incidente pequeno vira
          # indisponibilidade geral.
          cpus: "1.5"
          memory: 1536M
        reservations:
          # Piso: garante que a API não seja espremida por um vizinho barulhento.
          cpus: "0.25"
          memory: 512M

    logging:
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    restart: always

    ports: !override
      # A porta 80 do host é publicada pelo daemon do Docker, que roda como
      # root; o nginx dentro do contêiner continua como UID 101, sem privilégio.
      # TLS termina no proxy de borda (ALB, Cloudflare, Caddy) à frente disto.
      - "${AZ1_WEB_PORT:-80}:8080"

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M

  rabbitmq:
    restart: always

    # Credenciais padrão (az1/az1) são aceitáveis em desenvolvimento e
    # inaceitáveis aqui. Sem as variáveis definidas no ambiente, a subida FALHA
    # — em vez de subir com um broker de credencial conhecida. Mesma trava
    # ${VAR:?...} do MinIO abaixo.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?defina RABBITMQ_DEFAULT_USER no .env de produção}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?defina RABBITMQ_DEFAULT_PASS no .env de produção}

    # A porta de management (15672) NÃO é publicada em produção — o override de
    # desenvolvimento é quem a publica, e ele não é carregado aqui. A operação é
    # por rabbitmqctl/rabbitmq-diagnostics dentro do contêiner.

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M

  worker:
    restart: always

    # INDEXAÇÃO REAL FICA DESLIGADA EM PRODUÇÃO, DE PROPÓSITO. A base monta o token
    # por `${GOOGLE_TOKEN_FILE:-/dev/null}`; produção NÃO define GOOGLE_TOKEN_FILE,
    # então o default `/dev/null` prevalece e `_indexacao_disponivel` cai no stub
    # `VarreduraDeConexao` (fecha delta sem baixar). Isso é deliberado: o modelo de
    # auth atual é OAuth de "Desktop app" com refresh_token montado do host —
    # single-tenant, operado à mão, adequado para PoC/demo, NÃO para um serviço de
    # produção multiusuário. Habilitar indexação real em produção exigiria uma
    # Google Service Account (ou OAuth server-side com consentimento por usuário) e
    # um cofre de segredos — fora do escopo desta entrega. Não aponte
    # GOOGLE_TOKEN_FILE em produção sem antes trocar o modelo de auth.
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:?defina RABBITMQ_URL no .env de produção}

    deploy:
      resources:
        limits:
          # O consumidor é leve — uma mensagem por vez, uma varredura por
          # mensagem —, então o teto é modesto de propósito.
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  minio:
    restart: always

    # Credenciais padrão são aceitáveis em desenvolvimento e inaceitáveis aqui.
    # Sem as chaves definidas no ambiente, a subida FALHA — em vez de subir
    # silenciosamente com minioadmin/minioadmin exposto.
    #
    # São as MESMAS variáveis que a API usa como chave de acesso S3, conforme o
    # docker-compose.yml. Um par único no .env, dois consumidores.
    environment:
      MINIO_ROOT_USER: ${AUDIO_STORAGE_ACCESS_KEY:?defina AUDIO_STORAGE_ACCESS_KEY no .env de produção}
      MINIO_ROOT_PASSWORD: ${AUDIO_STORAGE_SECRET_KEY:?defina AUDIO_STORAGE_SECRET_KEY no .env de produção (mínimo 8 caracteres)}
      # O console web não tem função em produção; a operação é por mc/SDK.
      MINIO_BROWSER: "off"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 256M
