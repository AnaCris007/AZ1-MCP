services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/az1-audio &&
      mc ilm rule import local/az1-audio < /config/lifecycle.json
      "
    volumes:
      - ./infra/minio/lifecycle.json:/config/lifecycle.json:ro

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: az1
      POSTGRES_PASSWORD: az1
      POSTGRES_DB: az1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Monta só o DDL, e não a pasta src/database inteira: 02_initial_data.sql
      # ainda é o molde genérico do template inicial do repositório (commit
      # 805d797), nunca preenchido com dados de verdade, e o Postgres o
      # executaria como SQL se a pasta inteira fosse montada aqui.
      # Recriar o banco do zero é `docker compose down -v`.
      - ./src/database/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U az1 -d az1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  postgres_data:
