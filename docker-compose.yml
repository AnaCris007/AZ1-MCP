# =============================================================================
# AZ1 — composição base
# =============================================================================
# Este arquivo descreve a topologia REAL do sistema: quem fala com quem, quem
# precisa estar saudável antes de quem, e sob que restrições cada contêiner
# roda. Ele sozinho sobe uma pilha equivalente à de produção.
#
# Ele quase nunca é usado sozinho, porém:
#
#   docker compose up                                  → base + override (dev)
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.prod.yml up -d    → base + produção
#
# O docker-compose.override.yml é carregado AUTOMATICAMENTE pelo compose quando
# nenhum -f é passado. É por isso que o dia a dia é "docker compose up" e a
# produção é o comando explícito: o caminho curto é o seguro de errar.
#
# Perfis (profiles) mantêm trainer e tests fora do up normal. Eles existem no
# arquivo, participam do build e da rede, e só sobem quando chamados.
# =============================================================================

# Prefixo de contêineres, redes e volumes. Fixar evita que o nome da pasta
# (que muda de máquina para máquina) decida o nome do volume de dados.
name: az1

# --- Blocos reaproveitados ---------------------------------------------------
# Campos de extensão (x-*) são ignorados pelo compose e servem de âncora YAML.
# Sem eles, cada bloco abaixo seria repetido em cada serviço — e a repetição é o
# que faz um endurecimento valer para três serviços e ser esquecido no quarto.

x-logging: &logging
  logging:
    driver: json-file
    options:
      # Sem limite, o log de um contêiner esquecido cresce até encher o disco da
      # instância. Já derrubou mais deploy do que bug de aplicação.
      max-size: "10m"
      max-file: "3"

x-hardening: &hardening
  security_opt:
    # Impede que um binário setuid dentro do contêiner escale privilégio: um
    # processo comprometido não consegue ganhar mais poder do que já tinha.
    - "no-new-privileges:true"
  cap_drop:
    # Nenhum destes serviços precisa de capacidade de kernel alguma. Derrubar
    # todas é mais defensável do que confiar no conjunto padrão do Docker, que
    # inclui CHOWN, SETUID, NET_RAW e outras que ninguém aqui usa.
    - ALL
  # PID 1 real, que colhe processos zumbis e repassa sinais. Sem isso, um
  # "docker stop" pode virar SIGKILL depois do timeout, cortando requisições.
  init: true

x-restart: &restart
  # "unless-stopped" e não "always": se alguém parou o contêiner de propósito
  # para investigar, ele não deve voltar sozinho no próximo boot da máquina.
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # api — FastAPI + pipeline de PLN
  # ---------------------------------------------------------------------------
  api:
    <<: [*logging, *hardening, *restart]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: runtime
      args:
        PYTHON_VERSION: "3.12"
        VERSION: ${AZ1_VERSION:-0.1.0}
        VCS_REF: ${AZ1_VCS_REF:-unknown}
        BUILD_DATE: ${AZ1_BUILD_DATE:-unknown}
    image: az1/api:${AZ1_VERSION:-dev}

    # O .env é esperado aqui: ele traz a chave do Gemini e demais segredos que a
    # API lê. A forma curta é usada por compatibilidade — a forma longa com
    # "required: false" exige Compose >= 2.24, e o ambiente de referência roda
    # 2.23. Num clone recém-feito, sem .env, o "docker compose up" ainda sobe
    # (a validação passa e o arquivo ausente é ignorado), mas o endpoint de chat
    # falha por falta da chave; copie o .env.example para .env antes de subir.
    env_file:
      - .env

    # Vem DEPOIS do env_file e vence: o .env é escrito para rodar a API no host
    # (localhost:9000), e dentro da rede do compose o MinIO atende por "minio".
    # Sem esta sobreposição, a API tentaria falar consigo mesma na 9000.
    environment:
      DATABASE_URL: ${DATABASE_URL:-${SUPABASE_DB_URL:-postgresql://az1:az1@postgres:5432/az1}}
      # Barramento de mensagens (Sprint 5). Presente por padrão dentro do
      # compose: com ele, cada webhook marca o delta E publica o envelope; o
      # worker abaixo consome e faz a varredura. Sem RABBITMQ_URL (instalação
      # fora do compose), a API degrada para o publicador no-op e o
      # comportamento da Sprint 4 permanece intacto.
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://az1:az1@rabbitmq:5672/}
      AUDIO_STORAGE_ENDPOINT_URL: http://minio:9000
      AUDIO_STORAGE_BUCKET: ${AUDIO_STORAGE_BUCKET:-az1-audio}
      AUDIO_STORAGE_REGION: ${AUDIO_STORAGE_REGION:-us-east-1}
      # As mesmas duas variáveis com que o serviço `minio` sobe, logo abaixo.
      # Cliente e servidor lendo a MESMA entrada do .env é o que garante que
      # eles não possam divergir: com nomes separados, mudar um e esquecer o
      # outro produz 403 SignatureDoesNotMatch — erro que aparece só na primeira
      # gravação de áudio e não diz qual dos dois lados está errado.
      AUDIO_STORAGE_ACCESS_KEY: ${AUDIO_STORAGE_ACCESS_KEY:-minioadmin}
      AUDIO_STORAGE_SECRET_KEY: ${AUDIO_STORAGE_SECRET_KEY:-minioadmin}
      TZ: ${TZ:-America/Sao_Paulo}

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        # Espera o MinIO responder ao healthcheck, não apenas o processo existir.
        condition: service_healthy
      minio-init:
        # E espera o bucket existir. "service_started" deixaria a API subir antes
        # da criação do bucket — a primeira gravação de áudio daria NoSuchBucket.
        condition: service_completed_successfully
      rabbitmq:
        # Apenas "service_started", e não "service_healthy": a publicação é
        # OPCIONAL e degrada com o broker fora. A API não deve deixar de subir só
        # porque o RabbitMQ ainda está inicializando — se ele não estiver pronto
        # na primeira publicação, o receptor devolve 5xx e o provedor reentrega.
        condition: service_started

    # Sem "ports": a API não é publicada no host. Quem atende na porta é o
    # frontend, que encaminha /api pela rede interna. Uma porta a menos exposta
    # é uma porta a menos para proteger.
    expose:
      - "8000"

    # Sistema de arquivos imutável. A aplicação não escreve em disco: os áudios
    # vão para o S3/MinIO e o modelo é apenas lido. Se algum dia um processo
    # tentar gravar na raiz, a falha é imediata e visível, em vez de silenciosa.
    read_only: true
    tmpfs:
      # O UploadFile do Starlette usa SpooledTemporaryFile: acima de ~1 MB o
      # upload transborda para /tmp. Com raiz somente-leitura e sem este tmpfs,
      # todo áudio grande falharia. 128 MB cobrem o limite de 10 MB por arquivo
      # com folga para requisições concorrentes.
      - /tmp:size=128m,mode=1777

    networks:
      - backend

  # ---------------------------------------------------------------------------
  # frontend — bundle React servido por nginx, e porta de entrada da pilha
  # ---------------------------------------------------------------------------
  frontend:
    <<: [*logging, *hardening, *restart]
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: runtime
      args:
        NODE_VERSION: "22"
        # Vazio de propósito: o cliente chama /api na própria origem e o nginx
        # deste contêiner encaminha. Ver o comentário no Dockerfile do frontend.
        VITE_API_BASE_URL: ""
        # Mesmas duas variáveis que a API lê como SUPABASE_URL, abaixo — um
        # projeto Supabase, dois consumidores. Nome VITE_ diferente porque o
        # valor vai para dentro do bundle, não do processo do contêiner.
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
        VERSION: ${AZ1_VERSION:-0.1.0}
        VCS_REF: ${AZ1_VCS_REF:-unknown}
        BUILD_DATE: ${AZ1_BUILD_DATE:-unknown}
    image: az1/frontend:${AZ1_VERSION:-dev}

    environment:
      NGINX_PORT: "8080"
      API_UPSTREAM: http://api:8000

    ports:
      # 8080 e não 80 no host: 80 exige privilégio em Linux e costuma estar
      # ocupada. Quem termina TLS e atende na 443 em produção é o proxy de
      # borda, à frente desta porta.
      - "${AZ1_WEB_PORT:-8080}:8080"

    depends_on:
      api:
        condition: service_healthy

    read_only: true
    tmpfs:
      # O entrypoint da imagem nginx roda envsubst sobre o template e grava a
      # conf aqui na subida — é escrita legítima, e o único motivo de conf.d
      # precisar ser gravável.
      #
      # uid/gid 101 são obrigatórios, não decoração: um tmpfs nasce pertencendo
      # ao root, e o nginx desta imagem roda como 101. Sem isso o envsubst falha
      # com "conf.d is not writable", o nginx sobe assim mesmo — sem nenhum
      # server block — e a porta publicada recusa conexão sem uma linha de erro
      # que explique por quê.
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0755
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0755
      - /tmp:size=16m,uid=101,gid=101,mode=1777

    # Nas duas redes por necessidade: "frontend" recebe do host, "backend" fala
    # com a API. É a peça que atravessa a fronteira, e a única.
    networks:
      - frontend
      - backend

  # ---------------------------------------------------------------------------
  # minio — armazenamento de áudio compatível com S3
  # ---------------------------------------------------------------------------
  minio:
    <<: [*logging, *restart]
    # Tag de release fixa, não "latest". Com "latest", a mesma composição sobe
    # versões diferentes em máquinas diferentes conforme a data do pull — o tipo
    # de divergência que só aparece em produção.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"

    # O usuário root do MinIO É a chave de acesso S3 que a API usa: nesta pilha
    # existe uma credencial só, com dois nomes apenas porque cada software
    # chama a sua variável de um jeito. A tradução acontece aqui, e o .env
    # guarda um par único.
    #
    # Atenção ao tamanho: o MinIO se recusa a INICIAR com senha de menos de 8
    # caracteres (e usuário de menos de 3). O contêiner fica reiniciando e a API
    # nunca sobe, porque espera o healthcheck dele.
    environment:
      MINIO_ROOT_USER: ${AUDIO_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AUDIO_STORAGE_SECRET_KEY:-minioadmin}

    volumes:
      # Volume nomeado, não bind mount: o Docker gerencia, sobrevive ao
      # "docker compose down" (só "down -v" apaga) e não depende do sistema de
      # arquivos do host — bind mount de dados em Windows/macOS paga uma
      # tradução de I/O que derruba a performance de escrita.
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Sem start_period, as falhas durante a inicialização contam para o limite
      # de retries e podem marcar o serviço como unhealthy antes de ele ter tido
      # chance de subir.
      start_period: 15s

    # Sem "ports" aqui: o MinIO só é alcançável de dentro da rede. O override de
    # desenvolvimento publica 9000/9001 para o console; produção não publica.
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # minio-init — cria o bucket e aplica o ciclo de vida, depois sai
  # ---------------------------------------------------------------------------
  # Contêiner de tarefa, não de serviço: roda uma vez, termina com 0 e acabou.
  # Deixar essa preparação a cargo de um passo manual no README é o que produz o
  # clássico "na minha máquina funciona" — aqui ela é parte da composição,
  # versionada e idempotente (--ignore-existing), então rodar de novo não quebra.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AUDIO_STORAGE_ACCESS_KEY: ${AUDIO_STORAGE_ACCESS_KEY:-minioadmin}
      AUDIO_STORAGE_SECRET_KEY: ${AUDIO_STORAGE_SECRET_KEY:-minioadmin}
      AUDIO_STORAGE_BUCKET: ${AUDIO_STORAGE_BUCKET:-az1-audio}
    # $$ escapa a interpolação do compose: a variável precisa chegar ao shell do
    # contêiner e ser expandida lá, com os valores do bloco environment acima.
    # Com um cifrão só, o compose substituiria pelo valor do host — vazio.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$AUDIO_STORAGE_ACCESS_KEY" "$$AUDIO_STORAGE_SECRET_KEY"
        mc mb --ignore-existing "local/$$AUDIO_STORAGE_BUCKET"
        mc ilm rule import "local/$$AUDIO_STORAGE_BUCKET" < /config/lifecycle.json
        echo "bucket $$AUDIO_STORAGE_BUCKET pronto"
    volumes:
      - ./infra/minio/lifecycle.json:/config/lifecycle.json:ro
    networks:
      - backend
    restart: "no"

  # ---------------------------------------------------------------------------
  # postgres — persistência estruturada (Seções 3.6 e 5.1.4)
  # ---------------------------------------------------------------------------
  postgres:
    <<: [*logging, *restart]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: az1
      POSTGRES_PASSWORD: az1
      POSTGRES_DB: az1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Inicialização de uma base local nova. Volumes existentes recebem a
      # migração 06 manualmente, sem apagar dados.
      - ./src/database/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql:ro
      - ./src/database/06_webhook_permissions.sql:/docker-entrypoint-initdb.d/06_webhook_permissions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U az1 -d az1"]
      interval: 5s
      timeout: 5s
      retries: 5
    # A API alcança postgres:5432 na rede interna; o override publica a porta
    # para ferramentas operacionais executadas no host.
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # rabbitmq — barramento de mensagens assíncrono (Seção 6.4.4)
  # ---------------------------------------------------------------------------
  # O receptor de webhook publica aqui; o worker abaixo consome e faz a
  # varredura da origem marcada como pendente. A imagem "-management" traz o
  # painel web na 15672, publicado só em desenvolvimento (ver override).
  rabbitmq:
    <<: [*logging, *restart]
    image: rabbitmq:3.13-management-alpine

    # Endurecimento explícito, e NÃO o x-hardening compartilhado: ao contrário
    # da API e do frontend, o RabbitMQ precisa de algumas capacidades de kernel
    # (o Erlang VM ajusta limites e o entrypoint faz chown do diretório de dados
    # na primeira subida). Derrubar TODAS, como faz o x-hardening, impediria a
    # inicialização. Mantém-se no-new-privileges e init, e derruba-se tudo menos
    # o conjunto mínimo de que o broker precisa.
    security_opt:
      - "no-new-privileges:true"
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

    # Sem read_only: o RabbitMQ escreve mnesia, logs e o cookie de Erlang no
    # diretório de dados, que é um volume nomeado — a raiz somente-leitura da API
    # não se aplica a um serviço com estado em disco.

    environment:
      # Credenciais padrão de desenvolvimento; produção as sobrepõe por variável
      # obrigatória (ver docker-compose.prod.yml).
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-az1}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-az1}

    volumes:
      # Volume nomeado, mesmo raciocínio do postgres_data: o Docker gerencia,
      # sobrevive ao "down" (só "down -v" apaga) e não paga a tradução de I/O de
      # um bind mount em Windows/macOS.
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      # check_port_connectivity confirma que o listener AMQP na 5672 aceita
      # conexão — mais barato que um check completo e suficiente para o
      # depends_on do worker.
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      # RabbitMQ leva alguns segundos para o Erlang VM e o plugin de management
      # subirem; sem um start_period generoso, as falhas iniciais contariam para
      # o limite de retries.
      start_period: 45s

    networks:
      - backend

  # ---------------------------------------------------------------------------
  # worker — consumidor da fila de varredura (Sprint 5)
  # ---------------------------------------------------------------------------
  # Mesma imagem da API (az1/api): o código do consumidor mora em src/mensageria,
  # já empacotado. Troca-se apenas o comando — em vez do uvicorn, roda o módulo
  # do consumidor, que abre o pool no papel az1_webhook e consome a fila.
  worker:
    <<: [*logging, *hardening, *restart]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: runtime
      args:
        PYTHON_VERSION: "3.12"
        VERSION: ${AZ1_VERSION:-0.1.0}
        VCS_REF: ${AZ1_VCS_REF:-unknown}
        BUILD_DATE: ${AZ1_BUILD_DATE:-unknown}
    image: az1/api:${AZ1_VERSION:-dev}

    # O entrypoint da imagem avisa sobre o modelo de PLN ausente e depois exec-a
    # o comando; o worker não usa o modelo, então dispensa-se o entrypoint e
    # roda-se o consumidor direto.
    entrypoint: []
    command: ["python", "-m", "mensageria.consumidor"]

    # Mesmo raciocínio da API: o .env é esperado (traz as credenciais do Drive e
    # a chave do Gemini de que a indexação real depende). Forma curta por
    # compatibilidade com Compose 2.23 — a forma longa "required: false" exigiria
    # >= 2.24. Sem .env o worker degrada para o stub, mas o "up" não quebra.
    env_file:
      - .env

    environment:
      # Para a INDEXAÇÃO REAL (baixar do Drive + vetorizar), o pool do worker
      # (DATABASE_URL) precisa apontar para o MESMO banco onde o canal do Drive foi
      # aberto — é lá que mora `integracao.conexao` com o delta_token que a
      # varredura lê e reescreve. E a coleção vetorial `vecs` fica no
      # SUPABASE_DB_URL. Para a PoC, o caminho coerente é os dois serem o MESMO
      # Supabase: por isso o default abaixo cai para SUPABASE_DB_URL antes do
      # postgres local. REQUISITO: abrir o canal (drive_channel_service abrir) no
      # host CONTRA O MESMO DB que o worker vai ler — se abrir contra o postgres
      # local e o worker ler o Supabase (ou vice-versa), a varredura não acha a
      # conexão e não indexa nada. Ver .env.example (bloco "Banco de dados").
      DATABASE_URL: ${DATABASE_URL:-${SUPABASE_DB_URL:-postgresql://az1:az1@postgres:5432/az1}}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://az1:az1@rabbitmq:5672/}
      TZ: ${TZ:-America/Sao_Paulo}

    # Token OAuth do Google Drive, montado do HOST para dentro do container no
    # caminho que o código espera: `drive_channel_service.CREDENCIAIS` e
    # `consumidor._indexacao_disponivel` procuram `.google_token.json` relativo ao
    # cwd, que aqui é o WORKDIR /app. Sem este arquivo (mais GOOGLE_CLIENT_ID/
    # SECRET e GEMINI_API_KEY, que já chegam pelo env_file), `_indexacao_disponivel`
    # devolve False e o worker degrada para o stub `VarreduraDeConexao`: fecha o
    # delta sem baixar arquivo nenhum. É EXATAMENTE o achado DEP-1 do QA.
    #
    # Gravável de PROPÓSITO (sem `:ro`): `obter_token()` reescreve o arquivo ao
    # renovar o access token. Mesmo com `read_only: true` na raiz, um bind mount de
    # arquivo específico permanece gravável — mantém-se o hardening do resto do fs
    # e abre-se só este ponto. Como o container roda como UID 10001 (ver
    # Dockerfile, USER 10001:10001), o `.google_token.json` no host precisa ser
    # legível E gravável por esse UID (ex.: `chmod 666 .google_token.json`, ou
    # `chown 10001 .google_token.json`) — senão a renovação falha ao reescrever.
    #
    # SEGREDO: este arquivo carrega o refresh_token da conta Google. É montado do
    # host, NUNCA vai para a imagem (está no .dockerignore/.gitignore) e este
    # arranjo — token de "Desktop app" OAuth operado pelo host — é adequado para a
    # PoC/single-tenant, NÃO para produção multiusuário. Produção exigiria service
    # account / OAuth server-side (ver docker-compose.prod.yml, que mantém o stub).
    #
    # A ORIGEM do mount é a variável GOOGLE_TOKEN_FILE, com default `/dev/null`. É
    # deliberado: montar `./.google_token.json` diretamente quebraria o `up` num
    # clone recém-feito — o Docker, ao não achar o arquivo de origem, CRIA um
    # diretório vazio no lugar, e a partir daí `_indexacao_disponivel` passa a ver
    # um "arquivo" que na verdade é um diretório. `/dev/null` como default evita
    # isso: é sempre um arquivo existente e vazio.
    #
    # Comportamento por combinação (o que o operador precisa saber):
    #   • creds do Drive AUSENTES (default de clone limpo): `_indexacao_disponivel`
    #     já dá False por falta de GOOGLE_CLIENT_ID/SECRET/GEMINI — worker no stub,
    #     o /dev/null nem é lido. Caminho curto seguro, sem crash.
    #   • creds + GEMINI presentes, mas GOOGLE_TOKEN_FILE NÃO apontado ao token
    #     real: `_indexacao_disponivel` vê /dev/null (existe) e dá True, mas ao ler
    #     o token vazio `json.loads("")` estoura DENTRO de `varrer()`. O consumidor
    #     trata (nack/requeue), então NÃO derruba o worker — mas entra em
    #     reentrega até o x-delivery-limit sem indexar. É erro de configuração:
    #     quem liga as creds tem de apontar o token junto (as três peças andam
    #     juntas). [RECOMENDAÇÃO DE CÓDIGO, não implementada: `_indexacao_disponivel`
    #     poderia exigir arquivo NÃO-vazio, tornando este combo um stub limpo.]
    #
    # Para LIGAR a indexação real, aponte GOOGLE_TOKEN_FILE ao token do host:
    #   GOOGLE_TOKEN_FILE=./.google_token.json   (no .env — ver .env.example)
    # Assim o caminho curto (up sem token) não quebra, e o caminho da demo é uma
    # linha no .env — sem editar o compose.
    volumes:
      - ${GOOGLE_TOKEN_FILE:-/dev/null}:/app/.google_token.json

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        # O worker, ao contrário da API, EXISTE para consumir o barramento: sem
        # broker saudável não há o que fazer, então aqui espera-se o healthcheck.
        condition: service_healthy

    # Sistema de arquivos imutável: o consumidor não escreve em disco (o único
    # ponto gravável de disco é o bind mount do token acima, aberto de propósito).
    # O único diretório gravável geral é /tmp — usado pelos downloads temporários
    # da varredura antes de vetorizar, e por arquivos temporários de bibliotecas.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

    # Sonda de LIVENESS do consumidor. Diferente da API, o worker não tem porta
    # nem endpoint /health: o modo de falha a detectar é o consumidor que morre
    # em loop silencioso de reconexão e some — o "restart" reage a um processo
    # que ENCERRA, mas não a um que trava sem sair. O healthcheck confirma que o
    # processo do consumidor (`mensageria.consumidor`) continua vivo lendo os
    # cmdline em /proc; sem dependência de rede externa, coerente com a raiz
    # somente-leitura. Usa-se `python -c` e não `pgrep` porque a imagem slim não
    # garante o procps, mas sempre tem o mesmo Python do healthcheck da API.
    # Ninguém faz depends_on: service_healthy do worker — isto é só
    # observabilidade (docker compose ps mostra healthy/unhealthy). Parâmetros
    # folgados: o consumidor é single-thread e um pico de varredura não deve
    # marcá-lo unhealthy à toa.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import glob, sys
          for p in glob.glob('/proc/[0-9]*/cmdline'):
              try:
                  with open(p, 'rb') as f:
                      if b'mensageria.consumidor' in f.read():
                          sys.exit(0)
              except OSError:
                  pass
          sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      # Generoso: cobre a abertura do pool no papel az1_webhook e a espera pelo
      # RabbitMQ saudável antes de o consumidor de fato começar a consumir.
      start_period: 40s

    networks:
      - backend

  # ---------------------------------------------------------------------------
  # trainer — retreina o classificador (perfil "ml")
  # ---------------------------------------------------------------------------
  #   docker compose --profile ml run --rm trainer
  #   docker compose --profile ml run --rm trainer python -m pln.experimento
  #
  # Roda o mesmo código, com as mesmas versões de biblioteca da API, e escreve
  # em ./resultados no host. É o que garante que o modelo servido em produção e
  # o modelo medido no experimento saíram do mesmo ambiente — resultado de PLN
  # muda com versão de scikit-learn, e essa é uma diferença cara de descobrir.
  trainer:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: trainer
      args:
        PYTHON_VERSION: "3.12"
    image: az1/trainer:${AZ1_VERSION:-dev}
    volumes:
      # Bind mount: o artefato precisa aterrissar no repositório do host, para
      # ser inspecionado e versionado. É o oposto do caso do MinIO.
      - ./resultados:/app/resultados
      - ./src/pln/dados:/app/src/pln/dados:ro
    # Em Linux, exporte DOCKER_UID=$(id -u) e DOCKER_GID=$(id -g) antes de rodar,
    # senão os arquivos gerados saem pertencendo ao root do host. Em Windows e
    # macOS o padrão 0:0 é o correto, porque a tradução de permissão é do Docker
    # Desktop e não há mapeamento de UID a acertar.
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # tests — suíte completa dentro da imagem (perfil "ci")
  # ---------------------------------------------------------------------------
  #   docker compose --profile ci run --rm tests
  #
  # Executa contra o pacote INSTALADO, com as dependências resolvidas na build.
  # É o mesmo que o pipeline de CI vai rodar, o que elimina a classe de falha
  # "passou na minha máquina e quebrou no CI por diferença de ambiente".
  tests:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
      args:
        PYTHON_VERSION: "3.12"
    image: az1/api-dev:${AZ1_VERSION:-dev}
    environment:
      # Os testes de API sobem o app com dependências substituídas por dublês,
      # mas a construção das dependências reais lê estas variáveis. Valores
      # fictícios bastam: nenhuma chamada de rede é feita.
      DEEPGRAM_API_KEY: "test-key"
      GEMINI_API_KEY: "test-key"
    command: ["python", "-m", "unittest", "discover", "-v", "tests"]
    networks:
      - backend

# --- Redes -------------------------------------------------------------------
# Duas redes em vez de uma, para que a segmentação seja estrutural e não uma
# regra que alguém precise lembrar de aplicar. Um contêiner novo colocado em
# "frontend" simplesmente não enxerga o MinIO; não há como esquecer de bloquear.
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    # "internal: true" cortaria o acesso da rede à internet — e a API precisa
    # dele, para Deepgram e Gemini. Fica registrado por que NÃO está ligado.

# --- Volumes -----------------------------------------------------------------
volumes:
  minio_data:
    name: az1_minio_data
  postgres_data:
    name: az1_postgres_data
  rabbitmq_data:
    name: az1_rabbitmq_data
