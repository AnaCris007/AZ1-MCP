# =============================================================================
# Cabecalhos de seguranca — arquivo separado por causa de uma armadilha do nginx
# =============================================================================
# add_header NAO e cumulativo entre niveis: uma location que declara qualquer
# add_header proprio descarta TODOS os herdados do server. Como /index.html e
# /assets/ precisam declarar Cache-Control, elas perderiam silenciosamente os
# cabecalhos de seguranca definidos acima — a resposta continuaria 200, sem
# nenhum sinal de que a protecao sumiu.
#
# Manter os cabecalhos aqui e dar include em cada bloco que declara add_header e
# o que impede que a proxima location acrescentada ao arquivo repita o erro.
#
# `always` faz valer tambem nas respostas de erro (4xx/5xx), que e justamente
# onde um cabecalho ausente costuma virar vetor.
# =============================================================================

# Impede o navegador de adivinhar o tipo do conteudo: um .txt com HTML dentro
# deixa de ser executavel como pagina.
add_header X-Content-Type-Options "nosniff" always;

# Proibe o app de ser embutido em iframe de terceiros (clickjacking).
add_header X-Frame-Options "DENY" always;

# Nao vaza o caminho interno navegado para destinos externos.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Microfone liberado apenas para a propria origem — o AZ1 grava audio, entao
# `microphone=()` quebraria o produto. Camera e geolocalizacao ficam negadas.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;

# Content-Security-Policy — mitigacao de XSS. Importa mais aqui do que no app
# medio: o login com Microsoft guarda o token de sessao no sessionStorage do
# navegador (ver src/frontend/src/lib/supabase.js), e e a CSP quem limita o que
# um script injetado consegue fazer com ele.
#
# Cada diretiva abaixo existe por uma dependencia real do bundle atual, nao por
# precaucao — remover qualquer uma quebra alguma coisa visivel:
#   style-src  'unsafe-inline'          framer-motion aplica estilo via atributo
#                                        style="" (transform/opacity das animacoes)
#   style-src  fonts.googleapis.com     src/index.css importa a fonte Inter de la
#   font-src   fonts.gstatic.com        o CSS acima carrega os .woff2 de la
#   img-src    data: blob:              icones inline e preview de imagem
#   media-src  blob:                    reproducao do audio gerado pelo TTS
#   connect-src *.supabase.co           login, refresh de sessao e logout
#
# script-src fica em 'self' sem 'unsafe-inline': o build do Vite nao gera
# nenhum <script> inline (conferido em dist/index.html), entao nao ha por que
# abrir mao dessa protecao.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
