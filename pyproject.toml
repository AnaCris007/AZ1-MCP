# =============================================================================
# az1 — configuração de pacote e de ferramentas
# =============================================================================
# A existência deste arquivo é o que permite `pip install -e .` e, com isso,
# `from az1.pln import ...` funcionar de qualquer pasta, em qualquer script,
# sem nenhum `sys.path.insert`. Manipular sys.path é o remendo que se usa na
# ausência de um pacote instalado: funciona no arquivo onde foi escrito e
# quebra assim que alguém importa o módulo de outro lugar.
#
# Layout adotado: "src layout". O código fica em src/az1/ e não na raiz do
# repositório. A vantagem é que os testes rodam contra o pacote INSTALADO, e
# não contra os arquivos soltos ao lado — se um import estiver quebrado ou um
# arquivo de dados não for empacotado, o teste falha aqui, e não no deploy.
# =============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "az1"
version = "0.1.0"
description = "Agente de apoio à gestão do portfólio de projetos do PMO do Metrô de São Paulo"
requires-python = ">=3.12"
dependencies = [
    "nltk>=3.8",
    "scikit-learn>=1.4",
    "spacy>=3.7",
]

[project.optional-dependencies]
# Ferramentas de desenvolvimento, não necessárias para executar o agente.
dev = [
    "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["az1*"]

[tool.setuptools.package-data]
# Sem isto, os .csv de dados ficariam de fora do pacote instalado e o
# experimento quebraria ao rodar fora da pasta do repositório.
"az1.pln" = ["dados/*.csv"]
