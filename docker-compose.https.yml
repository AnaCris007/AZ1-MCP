# =============================================================================
# AZ1 — sobreposição de HTTPS (borda com Caddy)
# =============================================================================
# Carregada DEPOIS da base e da produção:
#
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml:docker-compose.https.yml
#   docker compose up -d --build
#
# O login com Microsoft (Supabase Auth, PKCE) e a captura de áudio do navegador
# só funcionam em contexto seguro, então o nginx não pode ficar exposto em HTTP
# puro. O Caddy termina TLS nas portas 80/443, emite e renova o certificado do
# Let's Encrypt sozinho e encaminha tudo para o nginx do frontend na rede
# interna. O nginx deixa de publicar porta no host: o Caddy passa a ser a única
# entrada.
#
# Requer no .env: AZ1_DOMAIN (ex.: 54-12-34-56.sslip.io) e o DNS desse nome
# apontando para o IP público da instância ANTES da subida — o Let's Encrypt
# valida o domínio pela porta 80.
# =============================================================================

services:
  frontend:
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    restart: always
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      AZ1_DOMAIN: "${AZ1_DOMAIN:?defina AZ1_DOMAIN no .env, por exemplo 54-12-34-56.sslip.io}"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados e chaves da conta ACME. Perder este volume força nova
      # emissão a cada subida, e o Let's Encrypt limita emissões por domínio.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    name: az1_caddy_data
  caddy_config:
    name: az1_caddy_config
